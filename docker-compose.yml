services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: chargewatch
      POSTGRES_USER: chargewatch_owner
      POSTGRES_PASSWORD: ${CW_DB_OWNER_PASSWORD:?Set CW_DB_OWNER_PASSWORD in .env}
      CW_IMPORT_PASSWORD: ${CW_IMPORT_PASSWORD:?Set CW_IMPORT_PASSWORD in .env}
      CW_READ_PASSWORD: ${CW_READ_PASSWORD:?Set CW_READ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargewatch_owner -d chargewatch"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    image: postgres:18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: chargewatch
      PGUSER: chargewatch_owner
      PGPASSWORD: ${CW_DB_OWNER_PASSWORD:?Set CW_DB_OWNER_PASSWORD in .env}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
volumes:
  pgdata:
