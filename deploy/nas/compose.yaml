# Run from repository root: docker compose -f deploy/nas/compose.yaml --env-file deploy/nas/.env up -d
# No host ports: database is intentionally private to the Compose network.
name: chargewatch
services:
  db:
    image: ghcr.io/vanhinthem/chargewatch-db:${CW_IMAGE_TAG:?Set CW_IMAGE_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_DB: chargewatch
      POSTGRES_USER: chargewatch_owner
      POSTGRES_PASSWORD: ${CW_DB_OWNER_PASSWORD:?Set CW_DB_OWNER_PASSWORD}
      CW_IMPORT_PASSWORD: ${CW_IMPORT_PASSWORD:?Set CW_IMPORT_PASSWORD}
      CW_READ_PASSWORD: ${CW_READ_PASSWORD:?Set CW_READ_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargewatch_owner -d chargewatch"]
      interval: 10s
      timeout: 5s
      retries: 12

  db-upgrade:
    image: ghcr.io/vanhinthem/chargewatch-maintenance:${CW_IMAGE_TAG:?Set CW_IMAGE_TAG}
    restart: "no"
    # Remain running after successful upgrade; UGREEN counts all stopped
    # containers as project errors, including exited(0) one-shot jobs.
    # On failure, the shell exits nonzero and health is never achieved.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/chargewatch-upgrade-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      db:
        condition: service_healthy
    environment:
      CW_IMAGE_TAG: ${CW_IMAGE_TAG:?Set CW_IMAGE_TAG}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: chargewatch
      PGUSER: chargewatch_owner
      PGPASSWORD: ${CW_DB_OWNER_PASSWORD:?Set CW_DB_OWNER_PASSWORD}
    volumes:
      - ${CW_NAS_BACKUP_DIR:?Set absolute NAS backup directory}:/backups
    entrypoint: ["/bin/sh", "-ec", "sh /scripts/db-upgrade.sh; touch /tmp/chargewatch-upgrade-ready; exec sleep infinity"]

  collector:
    image: ghcr.io/vanhinthem/chargewatch-collector:${CW_IMAGE_TAG:?Set CW_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-upgrade:
        condition: service_healthy
    environment:
      CW_IMPORT_CONNECTION: "Host=db;Port=5432;Database=chargewatch;Username=chargewatch_import;Password=${CW_IMPORT_PASSWORD:?Set CW_IMPORT_PASSWORD};Pooling=true;Timeout=30;Command Timeout=600"
      CW_NDW_CACHE_DIR: /data/cache
      CW_NDW_LOCATIONS_INTERVAL_MINUTES: ${CW_NDW_LOCATIONS_INTERVAL_MINUTES:-5}
      CW_NDW_TARIFFS_INTERVAL_MINUTES: ${CW_NDW_TARIFFS_INTERVAL_MINUTES:-60}
      CW_NDW_STALE_AFTER_MINUTES: ${CW_NDW_STALE_AFTER_MINUTES:-15}
      CW_NDW_MIN_LOCATIONS: ${CW_NDW_MIN_LOCATIONS:-50000}
      CW_ENABLE_COMPACT_STATISTICS: ${CW_ENABLE_COMPACT_STATISTICS:-0}
    command: ["--watch"]
    volumes:
      - ndw-cache:/data/cache

  api:
    image: ghcr.io/vanhinthem/chargewatch-api:${CW_IMAGE_TAG:?Set CW_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-upgrade:
        condition: service_healthy
    environment:
      CW_API_CONNECTION: "Host=db;Port=5432;Database=chargewatch;Username=chargewatch_read;Password=${CW_READ_PASSWORD:?Set CW_READ_PASSWORD};Pooling=true;Timeout=15;Command Timeout=30"
      CW_API_STALE_AFTER_MINUTES: ${CW_API_STALE_AFTER_MINUTES:-15}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "127.0.0.1:5088:8080"

  maintenance:
    image: ghcr.io/vanhinthem/chargewatch-maintenance:${CW_IMAGE_TAG:?Set CW_IMAGE_TAG}
    profiles: ["maintenance"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: chargewatch
      PGUSER: chargewatch_owner
      PGPASSWORD: ${CW_DB_OWNER_PASSWORD:?Set CW_DB_OWNER_PASSWORD}
    volumes:
      - ${CW_NAS_BACKUP_DIR:?Set absolute NAS backup directory}:/backups
    entrypoint: ["/bin/sh"]

volumes:
  pgdata:
  ndw-cache:
