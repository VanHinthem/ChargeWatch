name: NAS Images
on:
  push:
    branches: [main]
    paths:
      - 'src/ChargeWatch.Importer/**'
      - 'src/ChargeWatch.Api/**'
      - 'db/init/**'
      - 'db/migrations/**'
      - 'deploy/nas/**'
      - '.dockerignore'
      - '.github/workflows/nas-images.yml'
  pull_request:
    paths:
      - 'src/ChargeWatch.Importer/**'
      - 'src/ChargeWatch.Api/**'
      - 'db/init/**'
      - 'db/migrations/**'
      - 'deploy/nas/**'
      - '.dockerignore'
      - '.github/workflows/nas-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release shell scripts
        run: |
          sh -n deploy/nas/scripts/db-upgrade.sh
          bash -n deploy/nas/tests/test-db-upgrade.sh
      - name: Test release checkpoints and failure handling
        run: sudo --preserve-env=CW_IMAGE_TAG bash deploy/nas/tests/test-db-upgrade.sh
      - name: Validate Compose release wiring
        env:
          CW_IMAGE_TAG: sha-0123456789abcdef0123456789abcdef01234567
          CW_DB_OWNER_PASSWORD: test-owner
          CW_IMPORT_PASSWORD: test-import
          CW_READ_PASSWORD: test-read
          CW_NAS_BACKUP_DIR: /tmp/chargewatch-test-backups
        run: |
          docker compose -f deploy/nas/compose.yaml config --quiet
          docker compose --profile maintenance -f deploy/nas/compose.yaml config --format json > /tmp/chargewatch-compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/chargewatch-compose.json') as fp:
              services = json.load(fp)['services']
          tag = 'sha-0123456789abcdef0123456789abcdef01234567'
          for name in ('db', 'collector', 'api', 'maintenance', 'db-upgrade'):
              assert services[name]['image'].endswith(':' + tag), name
          for name in ('collector', 'api'):
              depends = services[name]['depends_on']
              assert depends['db-upgrade']['condition'] == 'service_completed_successfully'
          job = services['db-upgrade']
          assert job['restart'] == 'no'
          assert job['environment']['CW_IMAGE_TAG'] == tag
          assert job['volumes'][0]['target'] == '/backups'
          assert job['volumes'][0]['source'] == '/tmp/chargewatch-test-backups'
          print('NAS Compose release wiring validated')
          PY

  integration-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test database and maintenance images
        run: |
          set -eu
          docker build -f deploy/nas/Dockerfile.db -t ghcr.io/vanhinthem/chargewatch-db:sha-0123456789abcdef0123456789abcdef01234567 .
          docker build -f deploy/nas/Dockerfile.maintenance -t ghcr.io/vanhinthem/chargewatch-maintenance:sha-0123456789abcdef0123456789abcdef01234567 .
          docker build -f deploy/nas/Dockerfile -t ghcr.io/vanhinthem/chargewatch-collector:sha-0123456789abcdef0123456789abcdef01234567 .
          docker build -f deploy/nas/Dockerfile.api -t ghcr.io/vanhinthem/chargewatch-api:sha-0123456789abcdef0123456789abcdef01234567 .
      - name: Integration test with PostgreSQL 18
        run: bash deploy/nas/tests/integration-db-upgrade.sh

  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collector
            dockerfile: deploy/nas/Dockerfile
          - name: api
            dockerfile: deploy/nas/Dockerfile.api
          - name: db
            dockerfile: deploy/nas/Dockerfile.db
          - name: maintenance
            dockerfile: deploy/nas/Dockerfile.maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/vanhinthem/chargewatch-${{ matrix.name }}:sha-${{ github.sha }}
