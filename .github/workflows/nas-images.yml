name: NAS Images
on:
  push:
    branches: [main]
    paths:
      - 'src/ChargeWatch.Importer/**'
      - 'db/init/**'
      - 'db/migrations/**'
      - 'deploy/nas/**'
      - '.dockerignore'
      - '.github/workflows/nas-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collector
            dockerfile: deploy/nas/Dockerfile
          - name: db
            dockerfile: deploy/nas/Dockerfile.db
          - name: maintenance
            dockerfile: deploy/nas/Dockerfile.maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vanhinthem/chargewatch-${{ matrix.name }}:sha-${{ github.sha }}
