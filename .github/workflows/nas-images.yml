name: NAS Images
on:
  push:
    branches: [main]
    paths:
      - 'src/ChargeWatch.Importer/**'
      - 'src/ChargeWatch.Api/**'
      - 'db/init/**'
      - 'db/migrations/**'
      - 'deploy/nas/**'
      - '.dockerignore'
      - '.github/workflows/nas-images.yml'
  pull_request:
    paths:
      - 'src/ChargeWatch.Importer/**'
      - 'src/ChargeWatch.Api/**'
      - 'db/init/**'
      - 'db/migrations/**'
      - 'deploy/nas/**'
      - '.dockerignore'
      - '.github/workflows/nas-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release shell scripts
        run: |
          sh -n deploy/nas/scripts/db-upgrade.sh
          bash -n deploy/nas/tests/test-db-upgrade.sh
      - name: Test release checkpoints and failure handling
        run: sudo --preserve-env=CW_IMAGE_TAG bash deploy/nas/tests/test-db-upgrade.sh

  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collector
            dockerfile: deploy/nas/Dockerfile
          - name: api
            dockerfile: deploy/nas/Dockerfile.api
          - name: db
            dockerfile: deploy/nas/Dockerfile.db
          - name: maintenance
            dockerfile: deploy/nas/Dockerfile.maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/vanhinthem/chargewatch-${{ matrix.name }}:sha-${{ github.sha }}
