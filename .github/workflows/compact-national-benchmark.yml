name: Compact National Import Benchmark
on:
  pull_request:
    paths:
      - 'src/ChargeWatch.Importer/**'
      - 'db/migrations/**'
      - 'db/tests/019_national_fixture.py'
      - 'db/tests/020_national_http_fixture.py'
      - '.github/workflows/compact-national-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nationwide-full-import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: chargewatch_owner
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: chargewatch_national_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chargewatch_owner -d chargewatch_national_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: chargewatch_owner
      PGPASSWORD: test-only
      PGDATABASE: chargewatch_national_ci
      CW_IMPORT_CONNECTION: 'Host=localhost;Port=5432;Username=chargewatch_owner;Password=test-only;Database=chargewatch_national_ci'
      CW_ENABLE_COMPACT_STATISTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up full schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f db/init/001_schema.sql
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE chargewatch_import; CREATE ROLE chargewatch_read;'
          for migration in db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
      - name: Generate synthetic national feed
        run: |
          python3 db/tests/019_national_fixture.py /tmp/national-locations.json.gz 80777 203114
          python3 -c 'import gzip,json; tariff=[{"country_code":"NL","party_id":"TST","id":"RATE","currency":"EUR","last_updated":"2026-10-24T08:00:00Z","elements":[{"price_components":[{"type":"ENERGY","price":0.3,"step_size":1}]}]}]; gzip.open("/tmp/national-tariffs.json.gz","wt").write(json.dumps(tariff))'
      - name: Benchmark complete bulk importer with real catalogue schema
        run: |
          set -euo pipefail
          start=$(date +%s)
          dotnet run --project src/ChargeWatch.Importer -- --bulk /tmp/national-locations.json.gz /tmp/national-tariffs.json.gz 80777
          elapsed=$(($(date +%s)-start))
          echo "Full national-scale bulk import: ${elapsed} seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF (SELECT count(*) FROM charging_location)<>80777 OR
               (SELECT count(*) FROM evse)<>203114 OR
               (SELECT count(*) FROM connector)<>203114
            THEN RAISE EXCEPTION 'National-scale catalog counts incorrect'; END IF;
          END $verify$;
          SQL
          echo "NOTE: --bulk is not verified HTTP200: compact sample counters are intentionally not written." >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark verified national HTTP200 including statistics
        env:
          CW_NDW_LOCATIONS_URL: 'http://127.0.0.1:18888/locations'
          CW_NDW_TARIFFS_URL: 'http://127.0.0.1:18888/tariffs'
          CW_NDW_CACHE_DIR: '/tmp/cw-national-watch-cache'
          CW_NDW_MIN_LOCATIONS: '80777'
          CW_NDW_MIN_TARIFFS: '1'
        run: |
          set -euo pipefail
          python3 db/tests/020_national_http_fixture.py &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18888/locations -o /dev/null; then break; fi
            sleep 0.1
          done
          start=$(date +%s)
          dotnet run --no-build --project src/ChargeWatch.Importer -- --watch-once
          elapsed=$(($(date +%s)-start))
          echo "National HTTP200 import + compact counters: ${elapsed} seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF (SELECT count(*) FROM charging_location)<>80777 OR
               (SELECT count(*) FROM evse)<>203114 OR
               (SELECT count(*) FROM evse_snapshot_active_hour)<>203114 OR
               (SELECT count(*) FROM location_snapshot_active_hour)<>80777 OR
               EXISTS (SELECT 1 FROM evse_snapshot_active_hour WHERE changed_count<>1) OR
               EXISTS (SELECT 1 FROM location_snapshot_active_hour WHERE changed_count<>1)
            THEN RAISE EXCEPTION 'Verified nationwide HTTP200 lost compact statistics'; END IF;
          END $verify$;
          SQL
