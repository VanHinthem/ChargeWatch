name: NDW EVSE validation tests

on:
  pull_request:
    paths:
      - 'scripts/validate_ndw_evse.py'
      - 'scripts/tests/test_validate_ndw_evse.py'
      - '.github/workflows/ndw-evse-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic EVSE validation tests
        run: python -m unittest discover -s scripts/tests -p 'test_validate_ndw_evse.py' -v
