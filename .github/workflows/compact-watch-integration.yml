name: Compact Statistics Watch Integration
on:
  pull_request:
    paths:
      - 'src/ChargeWatch.Importer/**'
      - 'db/migrations/**'
      - 'db/tests/018_watch_http_fixture.py'
      - 'tests/PollCoverageIntegration/**'
      - 'tests/sql/poll_hour_rounding_regression.sql'
      - 'tests/sql/poll_coverage_candidate_benchmark.sql'
      - '.github/workflows/compact-watch-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-watch-flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: chargewatch_owner
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: chargewatch_watch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chargewatch_owner -d chargewatch_watch_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: chargewatch_owner
      PGPASSWORD: test-only
      PGDATABASE: chargewatch_watch_ci
      CW_IMPORT_CONNECTION: 'Host=localhost;Port=5432;Username=chargewatch_owner;Password=test-only;Database=chargewatch_watch_ci'
      CW_ENABLE_COMPACT_STATISTICS: '1'
      CW_NDW_LOCATIONS_URL: 'http://127.0.0.1:18887/locations'
      CW_NDW_TARIFFS_URL: 'http://127.0.0.1:18887/tariffs'
      CW_NDW_MIN_LOCATIONS: '1'
      CW_NDW_CACHE_DIR: '/tmp/cw-watch-ci'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated full catalog database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f db/init/001_schema.sql
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE chargewatch_import; CREATE ROLE chargewatch_read;'
          for migration in db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
      - name: Run actual WatchRunner through HTTP200, HTTP304 and changed HTTP200
        run: |
          set -euo pipefail
          python3 db/tests/018_watch_http_fixture.py &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18887/locations -o /dev/null; then break; fi
            sleep 0.1
          done
          dotnet run --project src/ChargeWatch.Importer -- --watch-once
          psql -v ON_ERROR_STOP=1 -c "SELECT location_id,continuity_valid FROM location_observation_checkpoint;"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT count(*) FROM location_observation_checkpoint) <> 1
               OR (SELECT continuity_valid FROM location_observation_checkpoint) IS DISTINCT FROM false
            THEN RAISE EXCEPTION 'First location checkpoint must have continuity_valid=false (never NULL)'; END IF;
          END $check$;
          SQL
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT count(*) FROM charging_location)<>1 OR
               (SELECT count(*) FROM evse)<>1 OR
               (SELECT changed_count FROM evse_snapshot_active_hour)<>1 OR
               (SELECT unchanged_count FROM evse_snapshot_active_hour)<>0
            THEN RAISE EXCEPTION 'HTTP200 full import missed compact sample'; END IF;
          END $check$;
          SQL
          dotnet run --no-build --project src/ChargeWatch.Importer -- --watch-once
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT count(*) FROM snapshot_unchanged_hour)<>1 OR
               (SELECT poll_count FROM snapshot_unchanged_hour)<>1 OR
               (SELECT changed_count FROM evse_snapshot_active_hour)<>1
            THEN RAISE EXCEPTION 'HTTP304 did not journal exactly one compact observation'; END IF;
          END $check$;
          SQL
          touch /tmp/cw-fixture-changed
          # Kill the real collector after catalogue+statistics SQL, before commit.
          marker=/tmp/cw-watch-precommit-ready
          rm -f "$marker"
          CW_TEST_PAUSE_BEFORE_COMMIT_FILE="$marker" dotnet src/ChargeWatch.Importer/bin/Debug/net10.0/ChargeWatch.Importer.dll --watch-once &
          collector=$!
          ready=0
          for attempt in $(seq 1 200); do
            if [[ -s "$marker" ]]; then ready=1; break; fi
            if ! kill -0 "$collector" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Collector did not reach the precommit kill point'
            wait "$collector" || true
            exit 1
          fi
          kill -9 "$collector"
          wait "$collector" || true
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT status FROM evse) <> 'AVAILABLE'
               OR (SELECT changed_count FROM evse_snapshot_active_hour) <> 1
               OR (SELECT poll_count FROM snapshot_unchanged_hour) <> 1
            THEN RAISE EXCEPTION 'SIGKILL did not rollback the precommit import'; END IF;
          END $check$;
          SQL
          test -s /tmp/cw-watch-ci/locations.json.gz.pending-response.json
          # Restart with exactly the same downloaded response and observation time.
          dotnet run --no-build --project src/ChargeWatch.Importer -- --watch-once
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT status FROM evse) <> 'CHARGING'
               OR EXISTS (SELECT 1 FROM snapshot_unchanged_hour)
               OR (SELECT changed_count FROM evse_snapshot_active_hour) <> 2
               OR (SELECT unchanged_count FROM evse_snapshot_active_hour) <> 1
               OR (SELECT category_counts[1] FROM evse_snapshot_active_hour) <> 2
               OR (SELECT category_counts[2] FROM evse_snapshot_active_hour) <> 1
            THEN RAISE EXCEPTION 'HTTP304 to changed HTTP200 transition incorrect'; END IF;
          END $check$;
          SQL
          # Next revision: kill collector AFTER commit, BEFORE local cache promotion.
          touch /tmp/cw-fixture-postcommit
          postmarker=/tmp/cw-watch-postcommit-ready
          rm -f "$postmarker"
          CW_TEST_PAUSE_AFTER_COMMIT_FILE="$postmarker" dotnet src/ChargeWatch.Importer/bin/Debug/net10.0/ChargeWatch.Importer.dll --watch-once &
          postcollector=$!
          ready=0
          for attempt in $(seq 1 200); do
            if [[ -s "$postmarker" ]]; then ready=1; break; fi
            if ! kill -0 "$postcollector" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Collector did not reach postcommit hook'
            wait "$postcollector" || true
            exit 1
          fi
          kill -9 "$postcollector"
          wait "$postcollector" || true
          # The catalog/sample were committed, local gzip and state were not.
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT status FROM evse) <> 'INOPERATIVE'
               OR (SELECT changed_count FROM evse_snapshot_active_hour) <> 3
            THEN RAISE EXCEPTION 'Postcommit SIGKILL lost committed third sample'; END IF;
          END $check$;
          SQL
          test -s /tmp/cw-watch-ci/locations.json.gz.pending-response.json
          dotnet run --no-build --project src/ChargeWatch.Importer -- --watch-once
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT status FROM evse) <> 'INOPERATIVE'
               OR (SELECT changed_count FROM evse_snapshot_active_hour) <> 3
               OR (SELECT unchanged_count FROM evse_snapshot_active_hour) <> 1
               OR EXISTS(SELECT 1 FROM snapshot_unchanged_hour)
            THEN RAISE EXCEPTION 'Postcommit restart double-counted replay'; END IF;
          END $check$;
          SQL
          test ! -f /tmp/cw-watch-ci/locations.json.gz.pending-response.json
      - name: Validate real SnapshotPollCoverage against isolated PostgreSQL
        run: dotnet run --project tests/PollCoverageIntegration/PollCoverageIntegration.csproj
      - name: Verify PostgreSQL interval rounding overflow
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/poll_hour_rounding_regression.sql
      - name: Benchmark 205k poll candidates (diagnostic, not a performance gate)
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/poll_coverage_candidate_benchmark.sql
