name: Read-only API
on:
  pull_request:
    paths:
      - 'src/ChargeWatch.Api/**'
      - 'db/tests/018_readonly_api_role_smoke.sql'
      - '.github/workflows/read-only-api.yml'
      - 'docs/ARCHITECTURE.md'
      - 'docs/STATUS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build API
        run: dotnet build src/ChargeWatch.Api/ChargeWatch.Api.csproj --configuration Release
      - name: Run focused API selftest
        run: dotnet run --project src/ChargeWatch.Api/ChargeWatch.Api.csproj --configuration Release --no-build -- --self-test

  readonly-database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: chargewatch_owner
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: chargewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chargewatch_owner -d chargewatch"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: chargewatch_owner
      PGPASSWORD: test-only
      PGDATABASE: chargewatch
      POSTGRES_USER: chargewatch_owner
      POSTGRES_DB: chargewatch
      CW_IMPORT_PASSWORD: import-test-only
      CW_READ_PASSWORD: read-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Bootstrap schema and roles
        run: |
          psql -v ON_ERROR_STOP=1 -f db/init/001_schema.sql
          sh db/init/002_roles.sh
          for migration in db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
      - name: Verify API read-only database contract
        run: psql -f db/tests/018_readonly_api_role_smoke.sql

      - name: Verify inactive EVSE is hidden in actual HTTP API responses
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO charging_location
            (country_code,party_id,source_id,address,city,longitude,latitude,position,is_active)
          VALUES ('NL','TST','PRESENCE','CI Presence','Oss',5.53,51.75,
            ST_SetSRID(ST_MakePoint(5.53,51.75),4326)::geography,true);
          INSERT INTO evse (location_id,source_uid,status,is_active)
          SELECT id,'VISIBLE','AVAILABLE',true FROM charging_location WHERE source_id='PRESENCE';
          INSERT INTO evse (location_id,source_uid,status,is_active)
          SELECT id,'HISTORIC','AVAILABLE',false FROM charging_location WHERE source_id='PRESENCE';
          INSERT INTO connector(evse_id,source_id,standard)
          SELECT id,'connector-'||source_uid,'IEC_62196_T2'
          FROM evse WHERE location_id=(SELECT id FROM charging_location WHERE source_id='PRESENCE');
          SQL
          export CW_API_CONNECTION="Host=localhost;Port=5432;Username=chargewatch_read;Password=read-test-only;Database=chargewatch"
          ASPNETCORE_URLS=http://127.0.0.1:5089 dotnet run --project src/ChargeWatch.Api --configuration Release --no-launch-profile > /tmp/cw-api-presence.log 2>&1 &
          service=$!
          trap 'kill "$service" 2>/dev/null || true; cat /tmp/cw-api-presence.log' EXIT
          for retry in $(seq 1 70); do
            if curl -fsS 'http://127.0.0.1:5089/api/v1/data-status' >/dev/null; then break; fi
            if ! kill -0 "$service" 2>/dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:5089/api/v1/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=20) as r:
                  return json.load(r)
          locations=get('locations?q=Oss')
          assert len(locations)==1,locations
          loc=locations[0]
          assert loc['evseCount']==1 and loc['availableCount']==1,loc
          details=get('locations/'+str(loc['id']))
          assert len(details['evses'])==1,details
          assert details['evses'][0]['sourceUid']=='VISIBLE',details
          assert len(details['evses'][0]['connectors'])==1,details
          viewport=get('map/viewport?bbox=5.3,51.6,5.8,51.9')
          assert len(viewport['locations'])==1,viewport
          assert viewport['locations'][0]['totalCount']==1,viewport
          status=get('data-status')
          assert status['evseCount']==1 and status['connectorCount']==1,status
          print('Active-only API location, detail, viewport and data-status contract passed.')
          PY
