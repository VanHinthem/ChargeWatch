name: Read-only API
on:
  pull_request:
    paths:
      - 'src/ChargeWatch.Api/**'
      - 'db/tests/018_readonly_api_role_smoke.sql'
      - 'db/migrations/022_connector_snapshot_presence.sql'
      - 'db/tests/022_connector_snapshot_presence_smoke.sql'
      - '.github/workflows/read-only-api.yml'
      - 'docs/ARCHITECTURE.md'
      - 'docs/STATUS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build API
        run: dotnet build src/ChargeWatch.Api/ChargeWatch.Api.csproj --configuration Release
      - name: Run focused API selftest
        run: dotnet run --project src/ChargeWatch.Api/ChargeWatch.Api.csproj --configuration Release --no-build -- --self-test

  readonly-database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: chargewatch_owner
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: chargewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chargewatch_owner -d chargewatch"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: chargewatch_owner
      PGPASSWORD: test-only
      PGDATABASE: chargewatch
      POSTGRES_USER: chargewatch_owner
      POSTGRES_DB: chargewatch
      CW_IMPORT_PASSWORD: import-test-only
      CW_READ_PASSWORD: read-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Bootstrap schema and roles
        run: |
          psql -v ON_ERROR_STOP=1 -f db/init/001_schema.sql
          sh db/init/002_roles.sh
          for migration in db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
      - name: Verify connector presence reconciliation
        run: psql -v ON_ERROR_STOP=1 -f db/tests/022_connector_snapshot_presence_smoke.sql
      - name: Verify API read-only database contract
        run: psql -f db/tests/018_readonly_api_role_smoke.sql

      - name: Verify inactive EVSE is hidden in actual HTTP API responses
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO charging_location
            (country_code,party_id,source_id,address,city,longitude,latitude,position,is_active)
          VALUES ('NL','TST','PRESENCE','CI Presence','Oss',5.53,51.75,
            ST_SetSRID(ST_MakePoint(5.53,51.75),4326)::geography,true);
          INSERT INTO evse (location_id,source_uid,status,is_active)
          SELECT id,'VISIBLE','AVAILABLE',true FROM charging_location WHERE source_id='PRESENCE';
          INSERT INTO evse (location_id,source_uid,status,is_active)
          SELECT id,'HISTORIC','AVAILABLE',false FROM charging_location WHERE source_id='PRESENCE';
          INSERT INTO connector(evse_id,source_id,standard,is_active)
          SELECT id,'connector-'||source_uid,'IEC_62196_T2',true
          FROM evse WHERE location_id=(SELECT id FROM charging_location WHERE source_id='PRESENCE');
          INSERT INTO connector(evse_id,source_id,standard,is_active)
          SELECT id,'HISTORIC-CONNECTOR','IEC_62196_T2',false
          FROM evse WHERE source_uid='VISIBLE' AND location_id=(SELECT id FROM charging_location WHERE source_id='PRESENCE');
          -- 144 REMOVED EVSEs plus one PLANNED EVSE: none may inflate
          -- operational counts, connector categories or available capacity.
          INSERT INTO evse(location_id,source_uid,status,is_active)
          SELECT id,'REMOVED-'||n,'REMOVED',true
          FROM charging_location CROSS JOIN generate_series(1,144) n
          WHERE source_id='PRESENCE';
          INSERT INTO evse(location_id,source_uid,status,is_active)
          SELECT id,'PLANNED','PLANNED',true
          FROM charging_location WHERE source_id='PRESENCE';
          INSERT INTO connector(evse_id,source_id,standard,is_active)
          SELECT id,'non-operational-'||source_uid,'CHADEMO',true
          FROM evse WHERE source_uid LIKE 'REMOVED-%' OR source_uid='PLANNED';
          SQL
          export CW_API_CONNECTION="Host=localhost;Port=5432;Username=chargewatch_read;Password=read-test-only;Database=chargewatch"
          ASPNETCORE_URLS=http://127.0.0.1:5089 dotnet run --project src/ChargeWatch.Api --configuration Release --no-launch-profile > /tmp/cw-api-presence.log 2>&1 &
          service=$!
          trap 'kill "$service" 2>/dev/null || true; cat /tmp/cw-api-presence.log' EXIT
          for retry in $(seq 1 70); do
            if curl -fsS 'http://127.0.0.1:5089/api/v1/data-status' >/dev/null; then break; fi
            if ! kill -0 "$service" 2>/dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:5089/api/v1/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=20) as r:
                  return json.load(r)
          locations=get('locations?q=Oss')
          assert len(locations)==1,locations
          loc=locations[0]
          assert loc['evseCount']==1 and loc['availableCount']==1,loc
          details=get('locations/'+str(loc['id']))
          assert len(details['evses'])==146, len(details['evses'])
          assert sum(e['status']=='REMOVED' for e in details['evses'])==144
          assert sum(e['status']=='PLANNED' for e in details['evses'])==1
          visible=next(e for e in details['evses'] if e['sourceUid']=='VISIBLE')
          assert len(visible['connectors'])==1,visible
          assert any(e['status']=='REMOVED' and e['connectors'] for e in details['evses'])
          viewport=get('map/viewport?bbox=5.3,51.6,5.8,51.9')
          assert len(viewport['locations'])==1,viewport
          maploc=viewport['locations'][0]
          assert maploc['totalCount']==1 and maploc['availableCount']==1,maploc
          assert all(category['connectorType']!='CHADEMO' for category in maploc['connectorCategories']),maploc
          status=get('data-status')
          assert status['evseCount']==146 and status['connectorCount']==146,status
          print('Active-only API location, detail, viewport and data-status contract passed.')
          PY

      - name: Verify map filters and nearest selection against isolated HTTP API
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f db/tests/023_map_filters_fixture.sql
          export CW_API_CONNECTION="Host=localhost;Port=5432;Username=chargewatch_read;Password=read-test-only;Database=chargewatch"
          ASPNETCORE_URLS=http://127.0.0.1:5090 dotnet run --project src/ChargeWatch.Api --configuration Release --no-launch-profile > /tmp/cw-api-filters.log 2>&1 &
          service=$!
          trap 'kill "$service" 2>/dev/null || true; cat /tmp/cw-api-filters.log' EXIT
          for retry in $(seq 1 70); do
            if curl -fsS 'http://127.0.0.1:5090/api/v1/data-status' >/dev/null; then break; fi
            if ! kill -0 "$service" 2>/dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          base='http://127.0.0.1:5090/api/v1/'
          def get(path, params=None):
              url=base+path
              if params: url+='?'+urllib.parse.urlencode(params,doseq=True)
              with urllib.request.urlopen(url,timeout=20) as response:
                  return json.load(response), response.headers
          nearest=dict(latitude=51.76,longitude=5.55,radiusMeters=25000,limit=5)
          base_results,_=get('locations',nearest)
          assert len(base_results)==5
          qs=dict(nearest,connectorType='ccs2',power='gte150')
          matching,headers=get('locations',qs)
          assert headers.get('X-ChargeWatch-Filter-Version')=='1'
          assert [r['sourceId'] for r in matching]==['F2','F4','F6','F8','F10'], matching
          free,_=get('locations',dict(qs,minFree=1))
          assert [r['sourceId'] for r in free]==['F4','F6','F8','F10','F14'],free
          # Unfiltered viewport honestly rejects >999 locations; filtered viewport
          # must still succeed when >1000 nonmatching rows are in the bbox.
          try: get('map/viewport',dict(bbox='5.54,51.755,5.58,51.77'))
          except urllib.error.HTTPError as exc: assert exc.code==413
          else: raise AssertionError('Unfiltered >999-row viewport was not rejected')
          ccspower,_=get('map/viewport',dict(bbox='5.54,51.755,5.58,51.77',
                                            connectorType='ccs2',power='gte150'))
          ids=[i['featureId'] for i in ccspower['locations']]
          assert 'NL-FTR-F12' not in ids and 'NL-FTR-F16' not in ids,ids
          ten=next(x for x in ccspower['locations'] if x['featureId']=='NL-FTR-F10')
          assert ten['totalCount']==1 and ten['availableCount']==1,ten
          # DC 1000 V x 150 A is a calculated, usable 150 kW filter value.
          derived,_=get('locations',dict(latitude=51.76,longitude=5.564,
                                         radiusMeters=25000,limit=1,
                                         connectorType='ccs2',power='gte150'))
          assert [x['sourceId'] for x in derived]==['F14'],derived
          # Two available connectors on one EVSE do not count as two free EVSEs.
          two,_=get('locations',dict(qs,minFree=2))
          assert two==[],two
          # OR within connector types, AND with selected power on the SAME connector.
          combined,_=get('map/viewport',dict(bbox='5.54,51.755,5.58,51.77',
                 connectorType=['ccs2','type2'],power='gte150'))
          assert 'NL-FTR-F12' in [x['featureId'] for x in combined['locations']]
          less,_=get('locations',dict(nearest,power='lt50',limit=20))
          assert 'F16' not in [x['sourceId'] for x in less],less
          names,_=get('operators')
          assert 'Fastned' in names and 'Vattenfall InCharge' in names,names
          with urllib.request.urlopen(base+'locations?limit=1') as response:
              assert response.headers.get('X-ChargeWatch-Filter-Version') is None
          try: get('locations',dict(nearest,power='invalid'))
          except urllib.error.HTTPError as exc: assert exc.code==400
          else: raise AssertionError('Invalid filter did not return 400')
          print('EVSE-accurate filtered viewport, nearest, power, operators and compatibility passed')
          PY
